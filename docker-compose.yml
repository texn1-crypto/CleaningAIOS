x-app: &app
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://cleaningai:${POSTGRES_PASSWORD}@db:5432/cleaningai
    ENVIRONMENT: ${ENVIRONMENT:-production}
    INTERNAL_API_URL: http://web:8000
  depends_on:
    migrate:
      condition: service_completed_successfully
  networks: [backend]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cleaningai
      POSTGRES_USER: cleaningai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleaningai -d cleaningai"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  migrate:
    build: .
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cleaningai:${POSTGRES_PASSWORD}@db:5432/cleaningai
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
    networks: [backend]

  web:
    <<: *app
    ports: ["${WEB_PORT:-8000}:8000"]
    volumes: [tender_documents:/data/documents]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    volumes: [tender_documents:/data/documents]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      retries: 5

  scheduler:
    <<: *app
    command: ["python", "-m", "app.scheduler"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      retries: 5

  bot:
    <<: *app
    command: ["python", "-m", "app.bot"]
    # Some cloud routes intermittently black-hole Telegram's DNS-selected IP.
    # Keep the known-good endpoint configurable so operators can rotate it
    # without rebuilding the image or exposing the bot token.
    extra_hosts:
      - "api.telegram.org=${TELEGRAM_API_IP:-149.154.167.220}"
    depends_on:
      web: {condition: service_healthy}
    volumes: [tender_documents:/data/documents]
    profiles: ["telegram"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  tender_documents:

networks:
  backend:
