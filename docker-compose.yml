x-app: &app
  build:
    context: .
    args:
      RELEASE_SHA: ${RELEASE_SHA:-development}
      BUILD_TIME: ${BUILD_TIME:-unknown}
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://cleaningai:${POSTGRES_PASSWORD}@db:5432/cleaningai
    ENVIRONMENT: ${ENVIRONMENT:-production}
    INTERNAL_API_URL: http://web:8000
    RELEASE_SHA: ${RELEASE_SHA:-development}
    BUILD_TIME: ${BUILD_TIME:-unknown}
  depends_on:
    migrate:
      condition: service_completed_successfully
  networks: [backend]

services:
  crawl4ai:
    image: unclecode/crawl4ai:0.9.3@sha256:84751dab794259db05d5bd4e5c766a8041a65f0554326e4516e620abdf2fa18b
    restart: unless-stopped
    profiles: ["crawl"]
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
      CRAWL4AI_ALLOW_INTERNAL_URLS: "false"
      CRAWL4AI_ALLOW_INSECURE_TLS: "false"
    expose: ["11235"]
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11235/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 12
    networks: [crawl]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cleaningai
      POSTGRES_USER: cleaningai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleaningai -d cleaningai"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  migrate:
    build: .
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cleaningai:${POSTGRES_PASSWORD}@db:5432/cleaningai
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
    networks: [backend]

  web:
    <<: *app
    networks: [backend, crawl]
    ports: ["${WEB_PORT:-8000}:8000"]
    volumes: [tender_documents:/data/documents]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *app
    networks: [backend, crawl]
    command: ["python", "-m", "app.worker"]
    # Owner notifications use Telegram from the worker, so it needs the same
    # configurable cloud route as the long-polling bot service.
    extra_hosts:
      - "api.telegram.org=${TELEGRAM_API_IP:-149.154.167.220}"
    volumes: [tender_documents:/data/documents]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      retries: 5

  scheduler:
    <<: *app
    command: ["python", "-m", "app.scheduler"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      retries: 5

  bot:
    <<: *app
    command: ["python", "-m", "app.bot"]
    environment:
      DATABASE_URL: postgresql+psycopg://cleaningai:${POSTGRES_PASSWORD}@db:5432/cleaningai
      ENVIRONMENT: ${ENVIRONMENT:-production}
      INTERNAL_API_URL: http://web:8000
      RELEASE_SHA: ${RELEASE_SHA:-development}
      BUILD_TIME: ${BUILD_TIME:-unknown}
      OPENJARVIS_ENABLED: "true"
      OPENJARVIS_BASE_URL: ${BOT_OPENJARVIS_BASE_URL:-http://openjarvis:8011}
      OPENJARVIS_API_KEY: ${OPENJARVIS_API_KEY:-}
      OPENJARVIS_MODEL: qwen3:0.6b
    # Some cloud routes intermittently black-hole Telegram's DNS-selected IP.
    # Keep the known-good endpoint configurable so operators can rotate it
    # without rebuilding the image or exposing the bot token.
    extra_hosts:
      - "api.telegram.org=${TELEGRAM_API_IP:-149.154.167.220}"
    depends_on:
      web: {condition: service_healthy}
    volumes: [tender_documents:/data/documents]
    profiles: ["telegram"]
    networks: [backend, jarvis, crawl]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.30.10@sha256:bfc9c6d53cc6989aa5131a6fde6b162b2802d4d337657f3253b5f69579bddeee
    restart: unless-stopped
    profiles: ["jarvis"]
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes: [ollama_models:/root/.ollama]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    networks: [jarvis]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  openjarvis:
    build:
      context: .
      dockerfile: docker/openjarvis.Dockerfile
    restart: unless-stopped
    profiles: ["jarvis"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      JARVIS_NUM_CTX: "4096"
      OPENJARVIS_ENGINE_DEFAULT: ollama
      OPENJARVIS_API_KEY: ${OPENJARVIS_API_KEY:-}
    command: ["serve", "--host", "0.0.0.0", "--port", "8011", "--engine", "ollama", "--model", "qwen3:0.6b", "--agent", "simple"]
    depends_on:
      ollama: {condition: service_healthy}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /home/openjarvis/.openjarvis:rw,noexec,nosuid,uid=10001,gid=10001,mode=0700,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    networks: [jarvis]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

volumes:
  postgres_data:
  tender_documents:
  ollama_models:

networks:
  backend:
  jarvis:
    internal: true
  crawl:
