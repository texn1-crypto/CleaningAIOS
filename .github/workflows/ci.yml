name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-security:
    name: Container security gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - name: Build the production application image
        run: >-
          docker build
          --build-arg RELEASE_SHA=${{ github.sha }}
          --build-arg BUILD_TIME=ci
          --tag cleaningaios:${{ github.sha }}
          .
      - name: Scan the image for fixed high-impact vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cleaningaios:${{ github.sha }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          limit-severities-for-sarif: true
          version: v0.74.0
      - name: Upload the scan to GitHub code scanning
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - name: Static correctness checks
        run: |
          ruff check .
          mypy --strict app/chat.py app/agent_evals.py app/observability.py app/logging_config.py app/prompt_registry.py app/mcp_read_client.py app/company_brain_retrieval.py app/orchestrator_telemetry.py
          mypy --strict --follow-imports=skip app/agent_tools.py app/crawl4ai_client.py app/quality_criteria.py
          mypy --strict --follow-imports=skip app/task_requests.py app/deployment_probes.py
          mypy --strict --follow-imports=skip app/tender_search.py
          mypy --strict --follow-imports=skip app/lead_reports.py
          mypy --strict --follow-imports=skip app/backlog_health.py app/task_state.py
          mypy --strict --follow-imports=skip app/company_profiles.py
          mypy --strict --follow-imports=skip app/tender_prequalification.py
          mypy --strict --follow-imports=skip app/tender_supplier_candidates.py
          mypy --strict --follow-imports=skip app/tender_supplier_quotes.py
          mypy --strict --follow-imports=skip app/tender_autopilot.py
          mypy --strict --follow-imports=skip app/tender_document_intelligence.py
          mypy --strict --follow-imports=skip app/tender_application_manifest.py
      - name: Agent behavior evals
        run: python scripts/run_agent_evals.py
      - name: Server automation syntax
        run: bash -n scripts/deploy_server.sh scripts/server_watchdog.sh scripts/install_server_watchdog.sh
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - run: pytest --cov=app --cov-report=term-missing --junitxml=test-results.xml
      - name: Verify 100 quality criteria against executed regression results
        run: python scripts/check_quality_criteria.py --junit test-results.xml > quality-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            test-results.xml
            quality-results.json
      - run: cp .env.example .env
      - run: python scripts/bootstrap_secrets.py .env
      - run: docker compose --env-file .env.example config
      - name: Compose production smoke test
        run: |
          docker compose up -d --build db web worker scheduler
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/
          curl --fail http://127.0.0.1:8000/static/og-cleaningaios.png
          current_revision="$(docker compose exec -T db psql -U cleaningai -d cleaningai -Atc 'select version_num from alembic_version')"
          head_revision="$(docker compose run --rm migrate alembic heads | awk '{print $1}')"
          test "$current_revision" = "$head_revision"
          docker compose run --rm migrate alembic check
      - name: Compose logs
        if: always()
        run: docker compose logs --no-color --tail=200
      - name: Compose cleanup
        if: always()
        run: docker compose down -v
