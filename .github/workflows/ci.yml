name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: pytest --cov=app --cov-report=term-missing
      - run: cp .env.example .env
      - run: docker compose --env-file .env.example config
      - name: Compose production smoke test
        run: |
          docker compose up -d --build db web worker scheduler
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/
          curl --fail http://127.0.0.1:8000/static/og-cleaningaios.png
          test "$(docker compose exec -T db psql -U cleaningai -d cleaningai -Atc 'select version_num from alembic_version')" = "0010"
          docker compose run --rm migrate alembic check
      - name: Compose logs
        if: always()
        run: docker compose logs --no-color --tail=200
      - name: Compose cleanup
        if: always()
        run: docker compose down -v
