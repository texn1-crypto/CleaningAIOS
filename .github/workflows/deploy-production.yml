name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cleaningaios-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      PRODUCTION_COMPANY_PHONE: ${{ secrets.PRODUCTION_COMPANY_PHONE }}
      PRODUCTION_SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
      PRODUCTION_PATH: ${{ vars.PRODUCTION_PATH || '/opt/cleaningaios' }}
      PRODUCTION_COMPANY_SERVICE_AREA: ${{ vars.PRODUCTION_COMPANY_SERVICE_AREA || 'Санкт-Петербург и Ленинградская область' }}
      PRODUCTION_MANAGEMENT_CONTACT_REGIONS: ${{ vars.PRODUCTION_MANAGEMENT_CONTACT_REGIONS || 'Санкт-Петербург|Ленинградская область' }}
    steps:
      - name: Check out the tested release
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve and verify the main release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          git fetch --quiet origin main
          test "$target_sha" = "$(git rev-parse origin/main)"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Validate production connection settings
        shell: bash
        run: |
          set -euo pipefail
          for variable in PRODUCTION_SSH_HOST PRODUCTION_SSH_USER PRODUCTION_SSH_KEY PRODUCTION_SSH_KNOWN_HOSTS PRODUCTION_COMPANY_PHONE; do
            test -n "${!variable:-}" || { echo "Missing required production secret: $variable" >&2; exit 1; }
          done
          [[ "$PRODUCTION_SSH_HOST" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$PRODUCTION_SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$PRODUCTION_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$PRODUCTION_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]
          [[ "$PRODUCTION_COMPANY_PHONE" =~ ^\+?[0-9()\ -]{7,32}$ ]]
          [[ "$PRODUCTION_COMPANY_SERVICE_AREA" != *$'\n'* ]]
          [[ "$PRODUCTION_COMPANY_SERVICE_AREA" != *'='* ]]
          [[ "$PRODUCTION_MANAGEMENT_CONTACT_REGIONS" != *$'\n'* ]]
          [[ "$PRODUCTION_MANAGEMENT_CONTACT_REGIONS" != *'='* ]]

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/cleaningaios_deploy"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/cleaningaios_deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy tested release to the server
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$HOME/.ssh/cleaningaios_deploy"
            -p "$PRODUCTION_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )
          remote_script="/tmp/cleaningaios-deploy-$RELEASE_SHA.sh"
          remote_business_config="/tmp/cleaningaios-business-$RELEASE_SHA.env"
          local_business_config="$RUNNER_TEMP/cleaningaios-business-$RELEASE_SHA.env"
          umask 077
          {
            printf 'COMPANY_PHONE=%s\n' "$PRODUCTION_COMPANY_PHONE"
            printf 'COMPANY_SERVICE_AREA=%s\n' "$PRODUCTION_COMPANY_SERVICE_AREA"
            printf 'MANAGEMENT_CONTACT_REGIONS=%s\n' "$PRODUCTION_MANAGEMENT_CONTACT_REGIONS"
          } > "$local_business_config"
          scp -q -P "$PRODUCTION_SSH_PORT" \
            -i "$HOME/.ssh/cleaningaios_deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/deploy_server.sh \
            "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST:$remote_script"
          ssh "${ssh_options[@]}" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "umask 077; install -m 600 /dev/null '$remote_business_config'; cat > '$remote_business_config'" \
            < "$local_business_config"
          ssh "${ssh_options[@]}" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "chmod 700 '$remote_script'; chmod 600 '$remote_business_config'; '$remote_script' '$RELEASE_SHA' '$PRODUCTION_PATH' '$remote_business_config'; code=\$?; rm -f '$remote_script' '$remote_business_config'; exit \$code"

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/cleaningaios_deploy" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP"/cleaningaios-business-*.env
