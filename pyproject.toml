[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["output", "tmp"]

[tool.ruff.lint]
# The repository predates Ruff and has a large style backlog. Start with rules
# that catch syntax errors, invalid control flow and undefined names; expand the
# gate as legacy files are touched instead of creating an unsafe bulk rewrite.
select = ["E9", "F63", "F7", "F82"]
